<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Voice Assistant Animation</title>

    <style>
        /* --- Background layout --- */
        
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #000 60%, #050505 100%);
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
        }
        
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        /* --- Glow Circle --- */
        
        .glow-circle {
            position: relative;
            width: 250px;
            height: 250px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0) 70%);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.3), 0 0 60px rgba(0, 150, 255, 0.2);
            animation: pulse 3s infinite ease-in-out;
        }
        
        @keyframes pulse {
            0%,
            100% {
                transform: scale(1);
                opacity: 0.8;
            }
            50% {
                transform: scale(1.1);
                opacity: 1;
            }
        }
        /* --- Voice text --- */
        
        .voice-text {
            position: absolute;
            bottom: 18%;
            color: #fff;
            font-size: 1.5rem;
            text-align: center;
            letter-spacing: 2px;
            animation: fadeText 3s infinite ease-in-out;
        }
        
        @keyframes fadeText {
            0%,
            100% {
                opacity: 0.4;
            }
            50% {
                opacity: 1;
            }
        }
        /* --- Buttons --- */
        
        .button-container {
            position: absolute;
            bottom: 8%;
            display: flex;
            gap: 20px;
        }
        
        .btn {
            padding: 12px 28px;
            border: none;
            border-radius: 25px;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s ease;
            font-weight: 600;
        }
        
        .cancel-btn {
            background: #ff4c4c;
            color: #fff;
            box-shadow: 0 0 15px rgba(255, 76, 76, 0.6);
        }
        
        .cancel-btn:hover {
            background: #ff2e2e;
        }
        
        .mute-btn {
            background: #0078ff;
            color: #fff;
            box-shadow: 0 0 15px rgba(0, 120, 255, 0.6);
        }
        
        .mute-btn:hover {
            background: #005fd4;
        }
    </style>
</head>

<body>

    <!-- Background animation -->
    <canvas id="voiceWave"></canvas>

    <!-- Center glowing circle -->
    <div class="glow-circle"></div>
    <div class="voice-text" id="statusText">Listening...</div>

    <!-- Buttons -->
    <div class="button-container">
        <button class="btn cancel-btn" id="cancelBtn">Cancel</button>
        <button class="btn mute-btn" id="muteBtn">Mute</button>
    </div>

    <script>
        const canvas = document.getElementById("voiceWave");
        const ctx = canvas.getContext("2d");

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const particles = [];
        const numParticles = 500;
        const radius = 200;
        let isMuted = false;

        // Create particles
        for (let i = 0; i < numParticles; i++) {
            const angle = Math.random() * Math.PI * 2;
            const dist = Math.sqrt(Math.random()) * radius;

            const x = canvas.width / 2 + Math.cos(angle) * dist;
            const y = canvas.height / 2 + Math.sin(angle) * dist;

            particles.push({
                x,
                y,
                angle,
                dist,
                speed: 0.0015 + Math.random() * 0.0025,
                size: 1 + Math.random() * 1.5
            });
        }

        // Animate particles
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Background soft glow
            const gradient = ctx.createRadialGradient(
                canvas.width / 2, canvas.height / 2, 50,
                canvas.width / 2, canvas.height / 2, radius * 1.5
            );
            gradient.addColorStop(0, "rgba(255,255,255,0.15)");
            gradient.addColorStop(1, "rgba(0,0,0,0)");
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Particle wave
            ctx.fillStyle = isMuted ?
                "rgba(150,150,150,0.8)" :
                "rgba(255,255,255,0.9)";

            particles.forEach(p => {
                p.angle += p.speed;

                const x = canvas.width / 2 + Math.cos(p.angle) * p.dist;
                const y = canvas.height / 2 + Math.sin(p.angle) * p.dist;

                ctx.beginPath();
                ctx.arc(x, y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });

            requestAnimationFrame(animate);
        }

        animate();

        // Auto resize
        window.addEventListener("resize", () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // Buttons
        const muteBtn = document.getElementById("muteBtn");
        const cancelBtn = document.getElementById("cancelBtn");
        const statusText = document.getElementById("statusText");

        // Mute toggle
        muteBtn.addEventListener("click", () => {
            isMuted = !isMuted;
            muteBtn.textContent = isMuted ? "Unmute" : "Mute";
            statusText.textContent = isMuted ? "Muted..." : "Listening...";
        });

        // Cancel → go back
        cancelBtn.addEventListener("click", () => {
            statusText.textContent = "Cancelled";
            setTimeout(() => {
                window.location.href = "index.html";
            }, 800);
        });
    </script>

</body>

</html>
